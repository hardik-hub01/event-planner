<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Events - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-50 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white border border-zinc-200 rounded-xl p-8 shadow-sm">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-zinc-900">Admin Login</h1>
            <p class="text-sm text-zinc-600 mt-1">Only users with admin access can enter the dashboard.</p>
        </div>

        <form id="adminLoginForm" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-zinc-700 mb-1">Email</label>
                <input id="email" type="email" required class="w-full px-3 py-2 rounded border border-zinc-300 focus:outline-none focus:ring-2 focus:ring-zinc-900/20" placeholder="admin@company.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-zinc-700 mb-1">Password</label>
                <input id="password" type="password" required class="w-full px-3 py-2 rounded border border-zinc-300 focus:outline-none focus:ring-2 focus:ring-zinc-900/20" placeholder="Enter password">
            </div>

            <p id="errorMessage" class="hidden text-sm text-rose-600"></p>

            <button id="loginButton" type="submit" class="w-full py-2.5 rounded bg-zinc-900 text-white font-medium hover:bg-zinc-800 disabled:bg-zinc-400">
                Sign in as Admin
            </button>
        </form>

        <div class="mt-4 text-sm">
            <a href="/" class="text-zinc-600 hover:text-zinc-900">Back to website</a>
        </div>
    </div>

    <script type="module">
        import { apiClient } from './js/api-enhanced.js';

        const ADMIN_TOKEN_KEY = 'luminaAdminToken';
        const ADMIN_USER_KEY = 'luminaAdminUser';
        const form = document.getElementById('adminLoginForm');
        const errorEl = document.getElementById('errorMessage');
        const button = document.getElementById('loginButton');

        function getNextUrl() {
            const next = new URLSearchParams(window.location.search).get('next');
            if (!next || typeof next !== 'string') return '/admin.html';
            if (!next.startsWith('/')) return '/admin.html';
            return next;
        }

        function showError(message) {
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        function clearError() {
            errorEl.textContent = '';
            errorEl.classList.add('hidden');
        }

        async function tryExistingSession() {
            const token = localStorage.getItem(ADMIN_TOKEN_KEY) || localStorage.getItem('luminaToken');
            if (!token) return;

            try {
                apiClient.setToken(token);
                const profile = await apiClient.getAdminProfile();
                localStorage.setItem(ADMIN_TOKEN_KEY, token);
                localStorage.setItem(ADMIN_USER_KEY, JSON.stringify(profile.admin));
                window.location.href = getNextUrl();
            } catch (error) {
                localStorage.removeItem(ADMIN_TOKEN_KEY);
                localStorage.removeItem(ADMIN_USER_KEY);
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            clearError();
            button.disabled = true;
            button.textContent = 'Checking access...';

            try {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                const signInResult = await apiClient.signIn(email, password);
                const profile = await apiClient.getAdminProfile();

                localStorage.setItem(ADMIN_TOKEN_KEY, signInResult.token);
                localStorage.setItem(ADMIN_USER_KEY, JSON.stringify(profile.admin));

                window.location.href = getNextUrl();
            } catch (error) {
                localStorage.removeItem(ADMIN_TOKEN_KEY);
                localStorage.removeItem(ADMIN_USER_KEY);
                apiClient.clearToken();
                showError(error.message || 'Unable to sign in as admin.');
                button.disabled = false;
                button.textContent = 'Sign in as Admin';
            }
        });

        tryExistingSession();
    </script>
</body>
</html>
